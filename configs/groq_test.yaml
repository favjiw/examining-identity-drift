batch_name: test_groq
research_question: RQ1
n_runs: 1
themes_file: data/themes_test.json

conversation:
  temperature: 0.7
  system_prompt_file: data/prompts/conversation_system.txt
  max_tokens: 512

questionnaire:
  temperature: 0
  repeats: 1
  snapshots: [3]
  measure_agents: [A]
  include: all

agent_a:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  model: openai/gpt-oss-20b
  size_group: small
  family: llama3.1
agent_b:
  same_as: agent_a

persona_condition: none
runtime:
  concurrency: 1
  max_retries: 5
  log_dir: logs
